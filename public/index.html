<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c111b"><link rel="manifest" href="/manifest.webmanifest"><title>Fitness Tracker</title><style>
:root{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#eaf0fb;background:#0b1019}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:12px 17px;background:#287bff;color:white;font-weight:700}button.secondary{background:#222d3e;color:#dce7f7}button.ghost{background:transparent;color:#9cb8e9}button:disabled{opacity:.5;cursor:not-allowed}input,textarea{background:#0c1422;color:white;border:1px solid #34435b;border-radius:10px;padding:12px;width:100%}label{display:block;color:#b5c4d8;font-size:13px;margin:12px 0 5px}.shell{display:flex;min-height:100vh}.side{width:224px;background:#101824;padding:26px 16px;border-right:1px solid #253144}.brand{font-weight:900;font-size:20px;margin:0 10px 35px}.brand span{color:#3d91ff}.nav{display:block;width:100%;text-align:left;margin-bottom:9px;background:transparent;color:#aebcd1}.nav.active{background:#2469df;color:white}.main{flex:1;max-width:1300px;padding:35px 42px;margin:auto;width:100%}.muted{color:#9babc1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#141e2c;border:1px solid #293548;border-radius:18px;padding:23px;margin-bottom:18px}.metric{font-size:30px;font-weight:800;margin-top:10px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:20px}.hero .card{background:linear-gradient(110deg,#152b4b,#141e2c 70%)}h1{font-size:32px;margin:0 0 5px}h2{font-size:23px;margin:4px 0 14px}h3{margin:0 0 12px}p{line-height:1.5}.pill{display:inline-block;border-radius:20px;background:#173d75;color:#a8ceff;padding:6px 11px;font-size:12px;font-weight:800}.workout-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.tile{background:#1c2a3b;border:1px solid #30425a;border-radius:12px;padding:16px;text-align:left;color:white}.tile.done{border-color:#35bd84}.tile strong{display:block;font-size:18px;margin-bottom:8px}.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.image{width:100%;max-height:600px;object-fit:contain;background:white;border-radius:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.entry{padding:13px 0;border-bottom:1px solid #2b374a}.auth{max-width:430px;margin:9vh auto;padding:30px}.hidden{display:none!important}.notice{color:#ffbf82;margin:10px 0}.success{color:#59d9a2}.chart{width:100%;height:180px}.bar{height:8px;background:#29394e;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#308aff}.small{font-size:13px}.mobile-nav{display:none}@media(max-width:850px){.side{display:none}.main{padding:22px 16px 95px}.grid{grid-template-columns:repeat(2,1fr)}.hero,.two{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111b29;border-top:1px solid #30405a;z-index:9;justify-content:space-around;padding:8px 0}.mobile-nav button{font-size:11px;padding:11px 6px;background:none;color:#c3d4ec}h1{font-size:26px}}@media(max-width:410px){.grid{grid-template-columns:1fr 1fr}.metric{font-size:23px}.card{padding:17px}}
</style></head><body><div id="root"></div><script src="/app.js" defer></script></body></html>
